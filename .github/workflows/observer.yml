# The Observer: a Claude agent writes the weekly macro edition every Monday, opens
# a pull request and merges it, which publishes it (Vercel deploys master). An
# edition with advice wording run.mjs couldn't get rewritten stays open for review.
name: The Observer

on:
  schedule:
    # Mondays 01:23 UTC, after Tokyo's Monday open. Off the hour on purpose: GitHub
    # starts on-the-hour schedules late (the old 05:00 slot fired at 10:30–13:00),
    # and the edition should be live by Monday morning even if this one slips too.
    - cron: "23 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: observer
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Not `npm ci`: the lockfile drifts from package.json (Vercel installs with
      # `npm install` too), and ci refuses to run when they disagree.
      - run: npm install --no-audit --no-fund

      - name: Write edition
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/observer/run.mjs

      # Audio is a bonus: if any audio step fails, the edition still goes out without it.
      # The MP3 lives on a GitHub Release, not in the repo, so git history stays small.
      - name: Read edition aloud (Kokoro)
        id: audio
        continue-on-error: true
        run: |
          # GitHub's Ubuntu image has no ffmpeg; the first run synthesised every
          # paragraph and then died at the MP3 encode.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-save kokoro-js@1.2.1
          node scripts/observer/audio.mjs "content/observer/${{ steps.write.outputs.slug }}.json" "the-observer-${{ steps.write.outputs.slug }}.mp3"

      - name: Upload audio
        id: upload
        if: steps.audio.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.write.outputs.slug }}
        run: |
          gh release create "observer-$SLUG" "the-observer-$SLUG.mp3" \
            --title "The Observer — $SLUG (audio)" \
            --notes "Audio edition of The Observer for the week of $SLUG." \
            --latest=false

      - name: Link audio in edition
        if: steps.upload.outcome == 'success'
        env:
          SLUG: ${{ steps.write.outputs.slug }}
          DURATION: ${{ steps.audio.outputs.duration }}
          URL: https://github.com/${{ github.repository }}/releases/download/observer-${{ steps.write.outputs.slug }}/the-observer-${{ steps.write.outputs.slug }}.mp3
        run: |
          node -e '
            const fs = require("fs");
            const file = `content/observer/${process.env.SLUG}.json`;
            const edition = JSON.parse(fs.readFileSync(file, "utf8"));
            edition.audio = { url: process.env.URL, durationSeconds: Number(process.env.DURATION) };
            fs.writeFileSync(file, JSON.stringify(edition, null, 2) + "\n");
          '

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: observer/${{ steps.write.outputs.slug }}
          add-paths: content/observer/*.json
          commit-message: "The Observer: ${{ steps.write.outputs.slug }}"
          title: "The Observer: ${{ steps.write.outputs.title }}"
          body: |
            Edition of **The Observer** for the week of ${{ steps.write.outputs.slug }}, written by the Claude agent in `scripts/observer/run.mjs`.

            Audio: ${{ steps.upload.outcome == 'success' && 'read aloud with Kokoro and attached as a GitHub Release' || 'not generated this week (see the workflow log)' }}.

            ${{ steps.write.outputs.needs_review == '' && 'Every link was checked against the sources the agent read, and no advice wording was found, so the workflow merges this PR straight away. To take an edition down, revert the merge commit.' || format('**Held for review:** advice wording survived two rewrites ({0}). Edit it out on this branch, then merge to publish, or close to skip this week.', steps.write.outputs.needs_review) }}
          delete-branch: true

      # Merging publishes. The PR is the record, and reverting its merge takes an edition down.
      - name: Publish
        if: steps.cpr.outputs.pull-request-number != '' && steps.write.outputs.needs_review == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # GitHub works out a new PR's mergeability in the background; give it a few tries.
          for i in 1 2 3 4; do
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch && exit 0
            sleep 15
          done
          exit 1
